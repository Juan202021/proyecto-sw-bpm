<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación - Plataforma de Clientes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <div id="toast" class="toast hidden"></div>
        
        <header class="glass-header" style="justify-content: center; margin-bottom: 3rem;">
            <h2><a href="index.html" style="color: white; text-decoration: none;">Empresa de Gas</a></h2>
        </header>

        <div id="auth-section" class="section glass-panel active">
            <div class="tabs">
                <button class="tab-btn active" id="btn-tab-login" onclick="showAuthTab('login')">Iniciar Sesión</button>
                <button class="tab-btn" id="btn-tab-register" onclick="showAuthTab('register')">Registrarse</button>
            </div>
            
            <div id="login-tab" class="auth-content active">
                <h2>Bienvenido de nuevo</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label for="login-doc">Documento</label>
                        <input type="text" id="login-doc" required>
                    </div>
                    <div class="input-group">
                        <label for="login-pass">Contraseña</label>
                        <input type="password" id="login-pass" required>
                    </div>
                    <button type="submit" class="btn-primary">Ingresar</button>
                </form>
            </div>

            <div id="register-tab" class="auth-content hidden">
                <h2>Crea tu cuenta</h2>
                <form id="register-form">
                    <div class="input-group">
                        <label for="reg-name">Nombre Completo</label>
                        <input type="text" id="reg-name" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-doc">Documento</label>
                        <input type="text" id="reg-doc" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-phone">Teléfono</label>
                        <input type="tel" id="reg-phone" required>
                    </div>
                    <div class="input-group">
                        <label for="reg-pass">Contraseña</label>
                        <input type="password" id="reg-pass" required>
                    </div>
                    <button type="submit" class="btn-primary">Registrarse</button>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
    <script>
        // Check URL params for tab
        const urlParams = new URLSearchParams(window.location.search);
        const tab = urlParams.get('tab');
        if(tab === 'register') {
            showAuthTab('register');
        } else {
            showAuthTab('login');
        }
    </script>
</body>
</html>
